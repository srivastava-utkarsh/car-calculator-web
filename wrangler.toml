# Wrangler configuration for deploying Next.js app to Cloudflare Pages
name = "budgetgear-calculator"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Pages build output directory (required for Pages)
pages_build_output_dir = ".open-next"

# Environment variables (if needed)
# [vars]
# MY_VAR = "production"

# Production environment overrides
[env.production]
name = "budgetgear-calculator"

# Preview/staging environment overrides  
[env.preview]
name = "budgetgear-calculator-preview"