# Wrangler configuration for deploying Next.js app to Cloudflare Workers
name = "budgetgear-calculator"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Assets configuration for static files
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Environment variables (if needed)
# [vars]
# MY_VAR = "production"

# Production environment overrides
[env.production]
name = "budgetgear-calculator"

# Preview/staging environment overrides
[env.preview]
name = "budgetgear-calculator-preview"