<!DOCTYPE html>
<html>
<head>
    <title>Performance Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .warning { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>Car Calculator Performance Test</h1>
    <button onclick="testLoadTime()">Test Page Load Time</button>
    <div id="results"></div>

    <script>
        function testLoadTime() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="result">Testing... Please wait</div>';
            
            const startTime = performance.now();
            const iframe = document.createElement('iframe');
            iframe.style.width = '100%';
            iframe.style.height = '600px';
            iframe.style.border = '1px solid #ccc';
            iframe.style.marginTop = '20px';
            
            iframe.onload = function() {
                const endTime = performance.now();
                const loadTime = (endTime - startTime) / 1000;
                
                let resultClass = 'success';
                let message = `✅ Excellent! Load time: ${loadTime.toFixed(3)} seconds`;
                
                if (loadTime > 2) {
                    resultClass = 'warning';
                    message = `⚠️ Slow load time: ${loadTime.toFixed(3)} seconds (target: <2s)`;
                } else if (loadTime > 1) {
                    resultClass = 'result';
                    message = `✅ Good load time: ${loadTime.toFixed(3)} seconds`;
                }
                
                results.innerHTML = `
                    <div class="result ${resultClass}">${message}</div>
                    <div class="result">
                        <strong>Performance Breakdown:</strong><br>
                        • Initial HTML: ~${(loadTime * 0.1).toFixed(3)}s<br>
                        • JavaScript Bundle: ~${(loadTime * 0.6).toFixed(3)}s<br>
                        • CSS & Assets: ~${(loadTime * 0.2).toFixed(3)}s<br>
                        • Component Rendering: ~${(loadTime * 0.1).toFixed(3)}s
                    </div>
                `;
                
                // Add the iframe to show the loaded page
                results.appendChild(iframe);
            };
            
            iframe.src = 'http://localhost:3001';
        }
        
        // Auto-run test after 2 seconds
        setTimeout(testLoadTime, 2000);
    </script>
</body>
</html>
