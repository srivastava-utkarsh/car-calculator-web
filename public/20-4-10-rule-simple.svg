<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="180" fill="url(#bgGradient)" rx="8"/>
  
  <!-- Header -->
  <text x="400" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    20/4/10 RULE
  </text>
  <text x="400" y="42" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">
    Smart car buying guidelines
  </text>
  
  <!-- Rule 1: 20% -->
  <rect x="20" y="60" width="240" height="95" fill="#059669" rx="8"/>
  <circle cx="50" cy="85" r="15" fill="#dc2626"/>
  <text x="50" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">20%</text>
  <text x="75" y="80" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Pay 20% Down</text>
  <text x="25" y="105" fill="#d1fae5" font-family="Arial, sans-serif" font-size="11">Lower EMI, less total interest</text>
  <text x="25" y="125" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="10">Example: ₹20L car → ₹4L down payment</text>
  
  <!-- Rule 2: 4 Years -->
  <rect x="280" y="60" width="240" height="95" fill="#2563eb" rx="8"/>
  <circle cx="310" cy="85" r="15" fill="#7c3aed"/>
  <text x="310" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">4</text>
  <text x="335" y="80" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Max 4 Years</text>
  <text x="285" y="105" fill="#dbeafe" font-family="Arial, sans-serif" font-size="11">Shorter loans = less interest</text>
  <text x="285" y="125" fill="#93c5fd" font-family="Arial, sans-serif" font-size="10">Example: 3 years is even better!</text>
  
  <!-- Rule 3: 10% -->
  <rect x="540" y="60" width="240" height="95" fill="#d97706" rx="8"/>
  <circle cx="570" cy="85" r="15" fill="#0891b2"/>
  <text x="570" y="90" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">10%</text>
  <text x="595" y="80" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Max 10% Income</text>
  <text x="545" y="105" fill="#fef3c7" font-family="Arial, sans-serif" font-size="11">Keep expenses under 10% of income</text>
  <text x="545" y="125" fill="#fcd34d" font-family="Arial, sans-serif" font-size="10">Example: ₹50K income → ₹5K max EMI</text>
</svg>